# M-node schema for investing instance.

m_node:
  id: string
  op: bound | connect | probe | collapse | reframe | zoom | compose | decompose | test | update | reflect
  target: [s_node_id]
  reversibility: low | medium | high
  latency: string                    # expected time to result
  layer: object | method | meta
  fuzz_halo: string
  pre_state: [s_node_id]             # snapshot before
  post_state: [s_node_id]            # snapshot after
  rationale: string                  # why this op now

  # investing-specific
  cost: optional string              # transaction cost, opportunity cost
  feasibility_gate:
    capability_pass: bool
    constraint_pass: bool
    budget_pass: bool
