# S-node schema for investing instance.
# Mirrors framework S-node properties; adds investing-specific fields.

s_node:
  id: string                         # stable identifier, e.g. "world.vol-regime"
  type: belief | hypothesis | goal | constraint | scope | taste | self
  pole: intent | world | self
  content: string                    # natural-language description
  confidence: float                  # 0.0 - 1.0
  resolution: low | medium | high
  bandwidth: string                  # capacity it consumes
  provenance:
    source: string                   # where it came from (data vendor, paper, conversation)
    timestamp: ISO8601
    derived_from: [s_node_id]
  reversibility_cost: low | medium | high
  fuzz_halo: string                  # residual uncertainty not captured by confidence

  # investing-specific
  asset_class: optional string       # equity | fx | rates | credit | commodity | crypto
  horizon: optional string           # intraday | swing | position | long-term
  thesis_id: optional string         # links to parent thesis when scoped
